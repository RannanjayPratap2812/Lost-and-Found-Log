<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9622b">
<title>Lost &amp; Found Log</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mute:#7a7068;--acc:#d9622b;--line:#e8e0d5;--chip:#f3ebe0}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#292420;--ink:#f1ebe3;--mute:#a69b90;--acc:#f08a52;--line:#3a332d;--chip:#352e28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px 16px 100px}
h1{font:700 24px/1.2 Georgia,serif;margin:4px 0 2px}.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
input[type=search],input[type=text],input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--chip)}
.card div{padding:8px 10px}.card b{display:block}.card small{color:var(--mute)}
.chip{display:inline-block;background:var(--chip);border:0;color:var(--mute);border-radius:99px;padding:3px 10px;font-size:12px;margin:3px 4px 0 0;font-family:inherit}
button.chip{cursor:pointer}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--acc);color:#fff;border:0;border-radius:99px;padding:14px 22px;font:600 16px system-ui;box-shadow:0 4px 14px #0004;cursor:pointer}
.gear{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));background:none;border:0;font-size:22px;cursor:pointer}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.hero{width:100%;border-radius:12px;max-height:50vh;object-fit:contain;background:var(--chip)}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 15px system-ui;cursor:pointer;background:var(--acc);color:#fff}.btn.alt{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.spot{display:flex;gap:10px;margin-top:10px;align-items:center}.spot img{width:84px;height:64px;object-fit:cover;border-radius:8px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}label{font-size:13px;color:var(--mute);display:block;margin:10px 0 4px}
</style></head><body><main>
<button class="gear" id="gear" title="Settings">⚙️</button>
<h1>Lost &amp; Found Log</h1><p class="sub">Snap where you put it. Find it later.</p>
<input type="search" id="q" placeholder="Search item or place — “passport”, “bedroom drawer”">
<div id="list" class="grid"></div>
<div id="empty" class="empty" hidden>Nothing logged yet.<br>Tap “Put something away” and take a photo.</div>
</main>
<button class="fab" id="add">📷 Put something away</button>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<input type="file" id="imp" accept="application/json" hidden>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").trim().toLowerCase();
const fmt=t=>new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
let items=[];

/* ---------- storage (IndexedDB) ---------- */
let _db;
const open=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open("lostfound",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("items",{keyPath:"id"});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
async function tx(mode,fn){const d=await open();return new Promise((res,rej)=>{const t=d.transaction("items",mode),s=t.objectStore("items"),r=fn(s);
  t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const loadAll=()=>tx("readonly",s=>s.getAll()).then(r=>items=r||[]);
const put=rec=>tx("readwrite",s=>s.put(rec));
const del=id=>tx("readwrite",s=>s.delete(id));
async function reload(){try{await loadAll()}catch(e){items=[]}render()}

/* ---------- list ---------- */
function groups(){const m=new Map();
  [...items].sort((a,b)=>b.ts-a.ts).forEach(i=>{const k=norm(i.name);if(!m.has(k))m.set(k,[]);m.get(k).push(i)});
  return [...m.values()]}
function render(){
  const q=norm($("q").value);
  const g=groups().filter(grp=>!q||grp.some(i=>norm([i.name,i.place,(i.tags||[]).join(" ")].join(" ")).includes(q)));
  $("empty").hidden=items.length>0;
  $("list").innerHTML=g.map(grp=>{const i=grp[0];
    return `<div class="card" data-k="${esc(norm(i.name))}"><img src="${esc(i.img)}" alt=""><div><b>${esc(i.name)}</b><small>${esc(i.place||"")}</small><br><small>${fmt(i.ts)}</small></div></div>`}).join("");
}
$("q").addEventListener("input",render);
$("list").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)detail(c.dataset.k)});
const sheet=html=>{$("panel").innerHTML=html;$("sheet").classList.add("on")};
const close=()=>$("sheet").classList.remove("on");
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")close()});

function detail(k){
  const grp=items.filter(i=>norm(i.name)===k).sort((a,b)=>b.ts-a.ts),i=grp[0];if(!i)return;
  sheet(`<h2 style="margin:0 0 8px">${esc(i.name)}</h2><img class="hero" src="${esc(i.img)}" alt="">
  <p><b>${esc(i.place||"No place noted")}</b><br><small style="color:var(--mute)">Last seen ${fmt(i.ts)}</small></p>
  <div>${(i.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
  ${grp.length>1?`<label>Earlier spots</label>`+grp.slice(1,3).map(x=>`<div class="spot"><img src="${esc(x.img)}" alt=""><div><b>${esc(x.place||"")}</b><br><small style="color:var(--mute)">${fmt(x.ts)}</small></div></div>`).join(""):""}
  <div class="row"><button class="btn alt" id="mv">Moved it again</button><button class="btn alt" id="del">Delete latest</button><button class="btn alt" id="x">Close</button></div>`);
  $("x").onclick=close;
  $("del").onclick=async()=>{await del(i.id);close();reload()};
  $("mv").onclick=()=>{close();startAdd(i.name)};
}

/* ---------- add ---------- */
let pendingName="";
function startAdd(name){pendingName=name||"";$("file").click()}
$("add").onclick=()=>startAdd();
function shrink(file,max){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.78))};im.onerror=rej;im.src=u})}

async function autoLabel(dataUrl){
  const key=localStorage.getItem("lf_key");if(!key)return null;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:300,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:"image/jpeg",data:dataUrl.split(",")[1]}},
      {type:"text",text:'This photo shows where someone just put down a household item. Reply ONLY with JSON: {"item":"short name of the main object being stored, or empty if unclear","place":"concise location like Bedroom, top drawer, left side","tags":["room","furniture","position"]}'}]}]})});
  if(!r.ok)throw new Error(r.status);
  const t=(await r.json()).content.map(c=>c.text||"").join("");
  return JSON.parse(t.replace(/```json|```/g,"").trim());
}

$("file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const img=await shrink(f,1000),hasKey=!!localStorage.getItem("lf_key");
  const places=[...new Set(items.map(i=>i.place).filter(Boolean))].slice(0,6);
  sheet(`<h2 style="margin:0 0 8px">Where is it going?</h2><img class="hero" src="${img}" alt="">
  <p id="st" style="color:var(--mute);font-size:14px;margin:8px 0 0">${hasKey?"Reading the photo…":"Name it and say where. (Add an API key in ⚙️ for auto-labelling.)"}</p>
  <label>Item</label><input type="text" id="n" value="${esc(pendingName)}" placeholder="e.g. Passport">
  <label>Place</label><input type="text" id="p" placeholder="e.g. Bedroom, top drawer, left side">
  <div>${places.map(p=>`<button class="chip" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>
  <label>Tags (comma separated)</label><input type="text" id="t">
  <div class="row"><button class="btn" id="save">Save</button><button class="btn alt" id="cancel">Cancel</button></div>`);
  let live=true;$("cancel").onclick=()=>{live=false;close()};
  $("panel").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>$("p").value=b.dataset.p);
  if(hasKey)autoLabel(img).then(r=>{if(!live||!r)return;
    if(r.item&&!$("n").value)$("n").value=r.item;
    $("p").value=r.place||"";$("t").value=(r.tags||[]).join(", ");$("st").textContent="Auto-labelled — edit anything that’s off."}
  ).catch(()=>{if(live)$("st").textContent="Couldn’t auto-label (check your key). Add details by hand."});
  $("save").onclick=async()=>{
    const name=$("n").value.trim();if(!name){$("n").focus();return}
    live=false;
    await put({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,place:$("p").value.trim(),
      tags:$("t").value.split(",").map(s=>s.trim()).filter(Boolean),img,ts:Date.now()});
    close();reload();
  };
};

/* ---------- settings / backup ---------- */
$("gear").onclick=()=>{
  sheet(`<h2 style="margin:0 0 8px">Settings</h2>
  <label>Anthropic API key (optional, for auto-labelling photos)</label>
  <input type="password" id="k" value="${esc(localStorage.getItem("lf_key")||"")}" placeholder="sk-ant-…">
  <p style="color:var(--mute);font-size:13px">Stored only in this browser and sent only to api.anthropic.com. Use a key with a spend limit. Without a key, everything else still works.</p>
  <label>Backup &amp; sharing</label>
  <p style="color:var(--mute);font-size:13px;margin:0">Data lives on this device. To share with your household, export a file and import it on another device (items are merged).</p>
  <div class="row"><button class="btn" id="ks">Save key</button><button class="btn alt" id="ex">Export</button><button class="btn alt" id="im">Import</button><button class="btn alt" id="x">Close</button></div>`);
  $("x").onclick=close;
  $("ks").onclick=()=>{const v=$("k").value.trim();v?localStorage.setItem("lf_key",v):localStorage.removeItem("lf_key");close()};
  $("ex").onclick=()=>{const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(items)],{type:"application/json"}));
    a.download="lost-and-found-"+new Date().toISOString().slice(0,10)+".json";a.click()};
  $("im").onclick=()=>$("imp").click();
};
$("imp").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const arr=JSON.parse(await f.text());for(const r of arr)if(r&&r.id&&r.name&&r.img)await put(r);close();reload()}
  catch(x){alert("That file couldn’t be imported.")}
};
reload();
</script></body></html>
